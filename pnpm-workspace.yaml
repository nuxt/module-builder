packages:
  - example
  - example/playground

overrides:
  "@nuxt/kit": "~4.6.4"
  "@nuxt/module-builder": "workspace:*"
  "@nuxt/schema": "~4.6.4"
  nuxt: "~4.6.4"
  typescript: "~6.0.3"
  vue: "^3.5.45"
  vue-tsc: "^3.3.14"

shellEmulator: true

allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - nuxt
  - nuxt-nightly
  - '@nuxt/*'
  - vue
  - '@vue/*'
  - vue-sfc-transformer@0.3.3
