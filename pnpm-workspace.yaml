packages:
  - example
  - example/playground

overrides:
  "@nuxt/kit": "~4.5.2"
  "@nuxt/module-builder": "workspace:*"
  "@nuxt/schema": "~4.5.2"
  nuxt: "~4.5.2"
  typescript: "~5.9.3"
  vue: "^3.5.41"
  vue-tsc: "^3.3.10"

shellEmulator: true

allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - nuxt
  - nuxt-nightly
  - '@nuxt/*'
  - vue
  - '@vue/*'
