name: release

on:
  pull_request:
    branches:
      - main
      - v1
    types: [opened, synchronize, labeled, ready_for_review]
  push:
    branches:
      - main
      - v1

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  release-pkg-pr-new:
    # Skip pkg-pr-new on release PRs. Rely on main/v1 pushes and normal PRs instead.
    if: |
      (
        github.event_name == 'push'
        && (
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          || github.ref == 'refs/heads/v1'
        )
      ) || (
        github.event_name == 'pull_request'
        && !startsWith(github.head_ref, 'release/v')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true

      - name: Prepare build environment
        run: pnpm dev:prepare

      - run: pnpm build

      - name: publish nightly release
        # zizmor: ignore[use-trusted-publishing] false positive: publishing to ephemeral StackBlitz registry, not npm
        run: pnpm pkg-pr-new publish --compact --pnpm
