name: ci

on:
  push:
    branches:
      - main
      - v1
  pull_request:
    branches:
      - main
      - v1
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    # Skip on uppt release PRs (they don't include later main/v1 merges, nothing to test).
    # Run on main/v1 pushes, standard PRs, and GitHub merge queues.
    if: |
      (
        github.event_name == 'push'
        && (
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          || github.ref == 'refs/heads/v1'
        )
      ) || (
        github.event_name == 'pull_request'
        && !startsWith(github.head_ref, 'release/v')
      ) || (
        github.event_name == 'merge_group'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true

      - run: pnpm dev:prepare

      - name: 🔠 Lint project
        run: pnpm lint

      - name: ✂️ Knip project
        run: pnpm test:knip

      - name: ⚙️ Check package engines
        run: pnpm test:engines

      - name: 💪 Check published types (example)
        run: pnpm test:attw

      - name: 📦 Check `package.json` (example)
        run: pnpm test:publint

  ci:
    # Skip on uppt release PRs (they don't include later main/v1 merges, nothing to test).
    # Run on main/v1 pushes, standard PRs, and GitHub merge queues.
    if: |
      (
        github.event_name == 'push'
        && (
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          || github.ref == 'refs/heads/v1'
        )
      ) || (
        github.event_name == 'pull_request'
        && !startsWith(github.head_ref, 'release/v')
      )|| (
        github.event_name == 'merge_group'
      )
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26.13.0
          cache: true

      - run: pnpm dev:prepare

      - name: 🧪 Test project
        run: pnpm test

      - name: 🛠 Build project
        run: pnpm build

      - name: 🛠 Build project (example)
        run: pnpm example:build

      - name: 💪 Type check
        run: pnpm test:types

  engines-floor:
    # Skip on uppt release PRs (they don't include later main/v1 merges, nothing to test).
    # Run on main/v1 pushes, standard PRs, and GitHub merge queues.
    if: |
      (
        github.event_name == 'push'
        && (
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          || github.ref == 'refs/heads/v1'
        )
      ) || (
        github.event_name == 'pull_request'
        && !startsWith(github.head_ref, 'release/v')
      )|| (
        github.event_name == 'merge_group'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@22.18.0
          cache: true

      - name: 🔍 Check Node.js version
        run: pnpm exec node -e "if (process.version !== 'v22.18.0') { console.error('Expected v22.18.0, got ' + process.version); process.exit(1) }"

      - run: pnpm dev:prepare

      - name: 🧪 Test project
        run: pnpm test

      - name: 🛠 Build project (example)
        run: pnpm example:build
